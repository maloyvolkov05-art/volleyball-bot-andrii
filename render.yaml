services:
  - type: web
    name: volleyball-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python volleyball_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
